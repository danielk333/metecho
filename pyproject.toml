[project]
name = "metecho"
version = "0.1.0"
description = "Radar meteor analysis in Python and C"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Daniel Kastinen", email = "daniel.kastinen@irf.se" },
  { name = "Hampus Andersson", email = "hampus.andersson@irf.se" },
]
maintainers = [
  { name = "Daniel Kastinen", email = "daniel.kastinen@irf.se" },
  { name = "Hampus Andersson", email = "hampus.andersson@irf.se" },
]
license = { file = "LICENSE" }
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
  "astropy >= 6",
  "h5py >= 3.4.0",
  # "hardtarget >= 0.6.0",
  "hardtarget @ git+https://gitlab.irf.se/danielk/hardtarget.git@develop",
  "matplotlib >= 2.2.2",
  "numpy >= 1.19.5",
  "pandas",
  "pyant >= 1.1.0",
  "pyorb",
  "radardef >= 0.5.0",
  "scipy >= 1.4.1",
  "strenum ; python_version<'3.11'"
]

[project.urls]
Documentation = "https://danielk.developer.irf.se/metecho/"
Repository = "https://github.com/danielk333/metecho"

[project.scripts]
metecho = "metecho.cli:main"

[project.optional-dependencies]
all = [
  "metecho[develop]",
  "metecho[documentation]",
  "metecho[mpi]",
  "metecho[type_checker]",
  "metecho[plotting]",
  "metecho[profiling]",
  "metecho[tests]",
]
develop = ["pytest", "wheel", "build", "twine", "auditwheel", "pytest-cov", "ruff"]
documentation = [
  "docstr-coverage",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
  "matplotlib",
]
mpi = ["mpi4py"]
plotting = ["matplotlib"]
profiling = ["yappi >= 1.4.0"]
tests = ["pytest", "pytest-cov"]
type_checker = ["mypy >= 1.18.2", "xenon"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
include = ["metecho"]
source = ["./src/"]

[tool.coverage.report]
exclude_also = [
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",

  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
]

[tool.mypy]
disallow_untyped_defs = true
follow_untyped_imports = true
warn_unused_ignores = true
packages = ["metecho"]

[tool.pytest]
addopts = ["-v", "--cov"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
include = ["src/metecho/**"]

[tool.ruff.lint]
ignore = ["E203", "D203", "E251", "E501", "E226", "UP035", "PYI041", "B006", "C408", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
